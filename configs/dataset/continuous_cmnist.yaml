# Continuous-spurious CMNIST — colour strength is a continuous variable,
# not binary red/green.  Tests K>2 environment discovery on graded features.
# Relevant to chemistry where spurious features (scaffold frequency, MW) are continuous.
name: continuous_cmnist
arch: mlp
env_correlation: 0.9     # mean colour strength correlation with label
test_correlation: 0.5    # OOD: colour is uninformative (mean = 0.5)
label_noise: 0.25
data_dir: ./data
beta_concentration: 5.0  # controls spread of colour strength distribution
