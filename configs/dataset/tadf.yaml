# TADF emission wavelength — real chemistry dataset with property-based confounding.
# Binary classification: short-wavelength (< 492 nm) vs long-wavelength (>= 492 nm).
# Spurious correlation injected by subsampling: NumHeteroatoms is made to correlate
# with the label. A model using the shortcut fails on the unbiased test set.
name: tadf
arch: mlp
parquet_path: data/chemistry/tadf_preprocess.parquet
# Property-based spurious correlation.
spurious_property: feat_mol_NumHeteroatoms
spurious_correlation: 0.9
data_dir: ./data
