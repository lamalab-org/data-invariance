# TADF emission wavelength — real chemistry dataset with author-group confounding.
# Binary classification: short-wavelength (< 492 nm) vs long-wavelength (>= 492 nm).
# Spurious correlation: certain author groups publish predominantly on one class.
# Features: 2265 precomputed molecular descriptors (RDKit + Morgan fingerprints).
name: tadf
arch: mlp
parquet_path: /Users/kevinmaikjablonka/git/lamalab/clever-materials-hans/src/tex/output/tadf_preprocess.parquet
# Leave-one-author-group-out for OOD evaluation.
# Set to an author name to hold them out, or "none" for random split.
ood_author: "Chuluo Yang"
data_dir: ./data
