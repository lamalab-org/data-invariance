# MOF thermal stability — clever-materials-hans dataset (text-mined).
# Binary classification: thermally stable (>= 359K) vs unstable (< 359K).
# Features: RAC descriptors (174 feat_*) + geometric surface area.
# No spurious-correlation injection: cross-sample fragility is measured
# under the natural training distribution.
name: mof_thermal
arch: mlp
parquet_path: data/chemistry/mof_thermal_stability.parquet
target_column: assigned_T_decomp
data_dir: ./data
