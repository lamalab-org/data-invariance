defaults:
  - method: erm
  - dataset: cmnist
  - _self_

wandb:
  project: data-invariance
  tags: [dev]
  enabled: true

model:
  hidden_dim: 256

training:
  lr: 1e-3
  batch_size: 256
  epochs: 10
  seed: 42
  weight_decay: 1e-4

  # Discovery: loss-averaged environment identification
  discovery_epochs: 5
  discovery_upweight: 50.0    # α in w_i = 1 + α · ℓ_i / max(ℓ)
  num_discovery_envs: 2       # K environments (median split for K=2)

  # V-REx penalty (used by discovered_split method)
  lambda_disagree: 10.0       # base λ (overridden by auto_lambda when used)

  # Early stopping (0 = disabled)
  early_stop_patience: 0
