defaults:
  - method: erm  # override via `python run.py method=adversarial_split`
  - _self_

wandb:
  project: data-invariance
  # Tags support CLI override: `python run.py "wandb.tags=[dev,final,high_corr]"`
  # Keep "dev" until results are paper-ready; swap to "final" for reported runs.
  tags: [dev]
  enabled: true

data:
  train_correlation: 0.9   # strong spurious color-label correlation during training
  test_correlation: 0.1    # weak correlation at test time — this is the distribution shift
  label_noise: 0.25        # matches original CMNIST; prevents trivial color=label solutions
  data_dir: ./data

model:
  hidden_dim: 256
  # Whether SplitMLP/MultiHeadMLP uses one shared backbone or K independent backbones.
  # Separate backbones allow each head to learn genuinely different representations;
  # shared backbone limits specialisation to the linear heads.
  separate_backbones: false
  # Number of heads for adversarial split. 2 → SplitMLP (binary, sigmoid assignments);
  # >2 → MultiHeadMLP (K-way, softmax assignments). Other methods always use 2.
  num_heads: 2

training:
  lr: 1e-3
  batch_size: 256
  epochs: 10
  seed: 42
  # Weight on the KL disagreement term. Shared across all split methods so sweeps
  # are comparable. Too small → adversary has no effect; too large → heads diverge.
  lambda_disagree: 1.0
  # Adversary step size — only used by adversarial_split. Larger than model lr so
  # assignment weights move meaningfully within each alternating step.
  adv_lr: 1e-2
  # AdamW weight decay. Decoupled from the gradient update (unlike Adam's broken
  # weight decay). Small value — we are not sweeping this yet.
  weight_decay: 1e-4

  # ---- Adversarial split options (ignored by erm / random_split) ----

  # Assignment logit initialisation.
  # "zeros"  → sigmoid(0) = 0.5 everywhere, fully uniform start.
  # "random" → draw from N(0, adv_init_scale²), immediately creates a non-uniform
  #            partition so CE_A ≠ CE_B from step 1 and the adversary has a gradient.
  # "oracle" → initialize from ground-truth color labels (color=0 → +5, color=1 → -5).
  #            Sanity check: does the mechanism improve OOD when the partition is known?
  #            If yes, mechanism is sound; only bootstrap/discovery remains to solve.
  adv_init: "zeros"
  adv_init_scale: 1.0          # std of the random init; only used when adv_init=random

  # Gaussian noise std added independently to backbone features before each head.
  # Even with a shared backbone, each head sees slightly different inputs every
  # forward pass, preventing collapse to identical linear maps.
  head_noise: 0.0

  # Epochs to keep assignment logits frozen before the adversary activates.
  # Combined with adv_init=random: pre-differentiates the heads on a fixed random
  # partition before the adversary starts optimising it.
  adv_warmup_epochs: 0

  # Adversary gradient steps per model step. More steps give the adversary time
  # to commit to a partition before the model can equalise the heads again.
  adv_steps_per_model_step: 1

  # Epochs to linearly ramp lambda from 0 to lambda_disagree.
  # 0 → use lambda_disagree from epoch 0 (current behaviour).
  # N → start at lambda=0, reach full lambda at epoch N. Lets heads diverge first.
  lambda_warmup_epochs: 0

  # Lambda multiplier at the final epoch for discovered_split.
  # lambda(epoch) = lambda_disagree * (1 + (lambda_anneal_factor - 1) * epoch / (epochs - 1))
  # 1.0 → constant lambda (default). 10.0 → lambda grows 10x from first to last epoch.
  # Prevents overfitting: as the model equalises risk, the penalty stays effective.
  lambda_anneal_factor: 1.0

  # ---- Environment discovery options (used by discovered_split only) ----

  # Epochs to train the throw-away ERM discovery model.
  # Enough to learn the spurious feature but not enough to overfit.
  # 3–10 is usually sufficient; more epochs → more confident scores → sharper split.
  discovery_epochs: 5

  # Scoring criterion for environment discovery.
  # "entropy" → split by prediction entropy H(p). Works when colour≠label examples
  #             are genuinely uncertain (low correlation). Fails at high correlation
  #             where the model is confidently WRONG on colour≠label examples.
  # "loss"    → split by cross-entropy loss. colour≠label examples have high loss
  #             (model predicts wrong class based on colour). Works at any correlation.
  discovery_criterion: "loss"

  # Quantile threshold for environment split.
  # 0.5 → median split (50/50 balanced).
  # 0.1 → bottom 10% entropy (most confident) vs top 10% (most uncertain).
  #        Gives sharper environment contrast but uses less training data.
  # "extremes" → bottom Q% AND top Q% (both tails), discards the middle.
  # At high train_correlation (0.9), only ~10% of examples have colour≠label.
  # A 50/50 split dilutes env B with colour=label majority. Lower quantiles
  # (0.1–0.2) concentrate the signal.
  discovery_quantile: 0.5

  # Adversary mode — controls what the adversary optimises.
  # "task_loss"  → default: maximise per-head task loss; pushes examples toward their
  #                harder head, creating an easy/hard partition.  Does NOT reliably
  #                produce feature diversity.
  # "grad_div"   → gradient-diversity: minimise cosine similarity between the two
  #                heads' gradient update directions at the backbone output.
  #                δ_A_i = W_A^T·(softmax(logits_A_i)−y_i)  [direction backbone features
  #                need to move to reduce head A's loss on example i]
  #                adv_loss = cos_sim(Σ s_i δ_A_i, Σ (1−s_i) δ_B_i)
  #                Pushes toward a partition where heads specialise on DIFFERENT features
  #                (e.g., colour vs digit shape) rather than easy vs hard examples.
  adv_mode: "task_loss"

  # Entropy bonus coefficient for the adversary.
  # Adds -beta * H(s_i) to the adversary loss, penalising soft assignments and
  # accelerating commitment toward hard 0/1 partitions.
  # 0 → disabled (original formulation).
  adv_entropy_bonus: 0.0

  # Disagreement-threshold lambda scheduling.
  # Forces lambda=0 until the heads have diverged enough; only then applies the
  # KL penalty. Composable with lambda_warmup_epochs — the effective lambda is
  # the minimum of both schedules.
  #
  # lambda_threshold: disagreement (KL) below which lambda is held at 0.
  #   0.0 → disabled (lambda_warmup_epochs controls everything).
  # lambda_ramp_range: disagreement units above threshold over which lambda
  #   ramps linearly from 0 to its full value. 0.0 → hard step at threshold.
  lambda_threshold: 0.0
  lambda_ramp_range: 0.0
