defaults:
  - method: erm  # override via `python run.py method=adversarial_split`
  - _self_

wandb:
  project: data-invariance
  # Tags support CLI override: `python run.py "wandb.tags=[dev,final,high_corr]"`
  # Keep "dev" until results are paper-ready; swap to "final" for reported runs.
  tags: [dev]
  enabled: true

data:
  train_correlation: 0.9   # strong spurious color-label correlation during training
  test_correlation: 0.1    # weak correlation at test time — this is the distribution shift
  label_noise: 0.25        # matches original CMNIST; prevents trivial color=label solutions
  data_dir: ./data

model:
  hidden_dim: 256
  # Whether SplitMLP uses one shared backbone or two independent backbones.
  # Separate backbones allow the two heads to learn genuinely different
  # representations; shared backbone limits specialisation to the linear heads.
  separate_backbones: false

training:
  lr: 1e-3
  batch_size: 256
  epochs: 10
  seed: 42
  # Weight on the KL disagreement term. Shared across all split methods so sweeps
  # are comparable. Too small → adversary has no effect; too large → heads diverge.
  lambda_disagree: 1.0
  # Adversary step size — only used by adversarial_split. Larger than model lr so
  # assignment weights move meaningfully within each alternating step.
  adv_lr: 1e-2
  # AdamW weight decay. Decoupled from the gradient update (unlike Adam's broken
  # weight decay). Small value — we are not sweeping this yet.
  weight_decay: 1e-4

  # ---- Adversarial split options (ignored by erm / random_split) ----

  # Assignment logit initialisation.
  # "zeros"  → sigmoid(0) = 0.5 everywhere, fully uniform start.
  # "random" → draw from N(0, adv_init_scale²), immediately creates a non-uniform
  #            partition so CE_A ≠ CE_B from step 1 and the adversary has a gradient.
  adv_init: "zeros"
  adv_init_scale: 1.0          # std of the random init; only used when adv_init=random

  # Gaussian noise std added independently to backbone features before each head.
  # Even with a shared backbone, each head sees slightly different inputs every
  # forward pass, preventing collapse to identical linear maps.
  head_noise: 0.0

  # Epochs to keep assignment logits frozen before the adversary activates.
  # Combined with adv_init=random: pre-differentiates the heads on a fixed random
  # partition before the adversary starts optimising it.
  adv_warmup_epochs: 0

  # Adversary gradient steps per model step. More steps give the adversary time
  # to commit to a partition before the model can equalise the heads again.
  adv_steps_per_model_step: 1

  # Epochs to linearly ramp lambda from 0 to lambda_disagree.
  # 0 → use lambda_disagree from epoch 0 (current behaviour).
  # N → start at lambda=0, reach full lambda at epoch N. Lets heads diverge first.
  lambda_warmup_epochs: 0

  # Entropy bonus coefficient for the adversary.
  # Adds -beta * H(s_i) to the adversary loss, penalising soft assignments and
  # accelerating commitment toward hard 0/1 partitions.
  # 0 → disabled (original formulation).
  adv_entropy_bonus: 0.0

  # Disagreement-threshold lambda scheduling.
  # Forces lambda=0 until the heads have diverged enough; only then applies the
  # KL penalty. Composable with lambda_warmup_epochs — the effective lambda is
  # the minimum of both schedules.
  #
  # lambda_threshold: disagreement (KL) below which lambda is held at 0.
  #   0.0 → disabled (lambda_warmup_epochs controls everything).
  # lambda_ramp_range: disagreement units above threshold over which lambda
  #   ramps linearly from 0 to its full value. 0.0 → hard step at threshold.
  lambda_threshold: 0.0
  lambda_ramp_range: 0.0
