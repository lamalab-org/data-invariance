[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-invariance"
version = "0.1.0"
description = "Adversarial data splitting for training stability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "wandb>=0.17",
    "torchmetrics>=1.3",
    "datasets>=2.18",
    "Pillow>=10.0",
    "rdkit>=2025.9.6",
    "scikit-learn>=1.8.0",
    "wilds>=2.0.0",
    "transformers>=5.5.3",
    "lama-aesthetics",
    "torch-geometric>=2.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = ["tests", "data", "outputs", "*.ipynb"]

[tool.uv.sources]
lama-aesthetics = { git = "https://github.com/lamalab-org/lama-aesthetics.git" }
